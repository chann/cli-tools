<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="저장소 분석, Git 관리, 개발자용 변환, 백그라운드 실행을 위한 다섯 개의 Rust CLI 도구와 사용법."
    />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="cli-tools | 터미널 일을 더 짧게" />
    <meta
      property="og:description"
      content="분석, 정리, 변환, 백그라운드 실행을 위한 Rust CLI 도구 모음."
    />
    <meta
      property="og:image"
      content="https://chann.github.io/cli-tools/images/og-cli-tools-minimal.jpg"
    />
    <link rel="canonical" href="https://chann.github.io/cli-tools/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cli-tools-theme") || "system";
          const dark =
            stored === "dark" ||
            (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themeMode = stored;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>cli-tools | 터미널 일을 더 짧게</title>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="nav-shell">
        <a class="brand" href="#top" aria-label="cli-tools 홈">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <span>cli-tools</span>
        </a>
        <nav class="nav-links" aria-label="주요 메뉴">
          <a href="#tools">도구</a>
          <a href="#install">설치</a>
          <a href="https://github.com/chann/cli-tools">GitHub</a>
        </nav>
        <button
          class="theme-button"
          id="theme-toggle"
          type="button"
          aria-label="테마: 시스템. 다음 테마로 변경"
        >
          <span id="theme-label">시스템</span>
        </button>
      </div>
    </header>
    <main id="main">
      <section class="hero" id="top">
        <div class="hero__inner">
          <div class="hero__app-icon" aria-hidden="true">
            <span class="hero__glyph">&gt;_</span>
            <span class="hero__badge">5 CLI</span>
          </div>
          <p class="hero__product-name">cli-tools</p>
          <div class="hero__copy">
            <h1>터미널 일을,<br /><span>더 짧게.</span></h1>
            <p class="hero__summary">
              분석, 정리, 변환, 백그라운드 실행을 다섯 개의 빠른 Rust 도구로 끝냅니다.
            </p>
            <div class="hero__actions">
              <a class="button button--primary" href="#install">설치 보기</a>
              <a class="text-link" href="https://github.com/chann/cli-tools">
                GitHub에서 코드 보기
              </a>
            </div>
            <div class="hero__meta" role="group" aria-label="프로젝트 정보">
              <span>5 tools</span>
              <span>1 workspace</span>
              <span>MIT License</span>
            </div>
          </div>
        </div>
      </section>
      <div id="root"></div>
    </main>
    <footer class="site-footer">
      <div class="section-shell site-footer__inner">
        <a class="brand" href="#top">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <span>cli-tools</span>
        </a>
        <p>CHANN의 Rust CLI 모음. MIT License.</p>
        <a href="https://github.com/chann/cli-tools">GitHub</a>
      </div>
    </footer>
    <noscript>도구 탐색기와 복사 기능을 사용하려면 JavaScript가 필요합니다.</noscript>
    <script>
      (() => {
        const modes = ["system", "light", "dark"];
        const labels = { system: "시스템", light: "라이트", dark: "다크" };
        const media = matchMedia("(prefers-color-scheme: dark)");
        const button = document.getElementById("theme-toggle");
        const label = document.getElementById("theme-label");
        let mode = modes.includes(document.documentElement.dataset.themeMode)
          ? document.documentElement.dataset.themeMode
          : "system";

        const apply = () => {
          const resolved = mode === "system" ? (media.matches ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themeMode = mode;
          label.textContent = labels[mode];
          button.setAttribute(
            "aria-label",
            `테마: ${labels[mode]}. 다음 테마로 변경`,
          );
          try {
            localStorage.setItem("cli-tools-theme", mode);
          } catch {
            // The selected theme still applies for this visit.
          }
        };

        button.addEventListener("click", () => {
          mode = modes[(modes.indexOf(mode) + 1) % modes.length];
          apply();
        });
        media.addEventListener("change", () => {
          if (mode === "system") apply();
        });
        apply();
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
