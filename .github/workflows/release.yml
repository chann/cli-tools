name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_BINS: code-cost dev-tools git-tools prompt-export work-summary zzz

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches workspace version
        id: version
        shell: bash
        run: |
          version="$(
            python3 - <<'PY'
          import tomllib

          with open("Cargo.toml", "rb") as cargo_toml:
              manifest = tomllib.load(cargo_toml)

          print(manifest["workspace"]["package"]["version"])
          PY
          )"
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got '$tag'" >&2
            exit 1
          fi

          if [[ "$tag" != "v${version}" ]]; then
            echo "Tag '$tag' does not match workspace version 'v${version}'" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test:
    name: Test workspace
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: cargo test --workspace --all-targets

  build:
    name: Build ${{ matrix.target_name }}
    needs:
      - validate-version
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target_name: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target_name: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target_name: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      TARGET_NAME: ${{ matrix.target_name }}
      BINARY_DIR: target/${{ matrix.target_name }}/release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build binaries
        run: cargo build --release --workspace --bins --target "${{ matrix.target_name }}"

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="cli-tools-${VERSION}-${TARGET_NAME}"
          mkdir -p "dist/${package}"
          for bin in ${RELEASE_BINS}; do
            cp "${BINARY_DIR}/${bin}" "dist/${package}/"
          done
          tar -C dist -czf "${package}.tar.gz" "${package}"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "cli-tools-$env:VERSION-$env:TARGET_NAME"
          New-Item -ItemType Directory -Path "dist/$package" | Out-Null
          foreach ($bin in $env:RELEASE_BINS.Split(" ")) {
            Copy-Item "$env:BINARY_DIR/$bin.exe" "dist/$package/"
          }
          Compress-Archive -Path "dist/$package/*" -DestinationPath "$package.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-tools-${{ env.VERSION }}-${{ matrix.target_name }}
          path: |
            cli-tools-${{ env.VERSION }}-${{ matrix.target_name }}.tar.gz
            cli-tools-${{ env.VERSION }}-${{ matrix.target_name }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate-version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
